[package]
name = "raba-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
raba-core = { path = "../crates/raba-core" }
raba-gen = { path = "../crates/raba-gen" }

[[bin]]
name = "dur"
path = "fuzz_targets/dur.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
