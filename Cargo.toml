[workspace]
resolver = "2"
members = [
    "crates/raba-core",
    "crates/raba-term",
    "crates/raba",
    "crates/raba-gen",
    "crates/raba-setup",
    # Tier 3a: the /init for the QEMU harness. Never shipped. See docs/development.md.
    "crates/raba-vmtest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/brunohcorreia/raba"

# Enforced, not aspirational. See docs/maintenance.md.
[workspace.lints.rust]
# "deny" and not "forbid", because `forbid` cannot be lifted and one module has to
# lift it: `crates/raba/src/vt`, where the VT ioctls live. Everything that can keep
# the stronger promise makes it itself, at its own crate root — raba-core,
# raba-term and raba-gen all carry `#![forbid(unsafe_code)]`, which is where such a
# guarantee belongs anyway. See docs/maintenance.md.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
todo = "warn"

# The boot binary must be small. Binary size is a CI gate.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
