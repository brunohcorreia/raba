# garuda. Art and colours extracted from fastfetch; see scripts/fastfetch-logo.py.
# Distribution logos are trademarks of their respective projects.
#
# Hand edit: the extracted art used U+00B0 DEGREE SIGN, which is in the kernel's
# built-in font and missing from some that replace it. Replaced with ASCII "o".
# Regenerating with scripts/fastfetch-logo.py undoes this.
# fastfetch calls this logo 'Garuda'.

[logo]
source = "file:garuda.txt"
colors = [9]

[spinner]
style = "ascii"
position = "below"
gap = 1
color = 9

[canvas]
framerate = 8
