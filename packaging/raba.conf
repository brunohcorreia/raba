# /etc/raba/raba.conf — the boot splash's configuration. See raba.conf(5).
#
# Two things worth knowing before editing:
#
#   1. raba(8) runs before the root filesystem is mounted, so it cannot read
#      this file at boot. The initramfs hook bakes a resolved copy inside the
#      image. Changes here do nothing until the image is rebuilt:
#
#          sudo raba-setup --apply          # or: sudo mkinitcpio -P
#
#   2. A broken file still boots. Anything unparseable is stepped over and the
#      compiled-in default is used. `raba --check` is the strict reading — it
#      prints what this file resolves to and exits non-zero on any problem.
#
# Everything below is commented out and shows the default.

[Boot]
# Which animation. `auto` resolves through ID= and then ID_LIKE= in
# os-release(5), and falls back to the generic theme if neither matches.
# A bare name is looked up in /usr/share/raba/themes; an absolute path is used
# as given.
#Theme=auto

# Which virtual terminal to draw on. `auto` asks the kernel for a free one.
#Tty=auto

# Wait this long before the first frame, so a machine that boots faster than
# the eye shows nothing at all rather than a flash.
#ShowDelay=0

# Give the terminal back after this long, whatever else happens. 0 disables it
# — only do that if something is certain to call `raba-ctl quit`.
#Timeout=30

[Outro]
# Play a closing animation when asked to quit, if the theme has one.
#Enable=true
#MaxDuration=1.5

[Handoff]
# retain: leave the last frame on the screen for whatever comes next.
# clear:  clear the terminal first.
#Mode=retain
#RestoreTty=true

[Log]
#Level=warn
#File=/run/raba.log
