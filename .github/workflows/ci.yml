name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features so the `testing` feature's code is linted and compiled too.
      # The binary size job below is what proves it stays out of the boot binary.
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  shell:
    name: shellcheck the initramfs glue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hooks run as root in somebody's initramfs and during somebody's
      # kernel update. `cargo test` proves what they do; this proves they are
      # not written in a way that does something else by accident.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning integration/tests/*.sh
      # The install hook is sourced by mkinitcpio's bash, and the runtime hook
      # is run by busybox ash; neither has a shebang shellcheck can trust.
      - run: shellcheck --severity=warning --shell=bash integration/mkinitcpio/install/raba
      - run: shellcheck --severity=warning --shell=dash integration/mkinitcpio/hooks/raba

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size:
    name: binary size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build and measure
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p raba
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/raba)
          LIMIT=$(cat .binary-size-limit)
          echo "raba: $SIZE bytes (limit $LIMIT)"
          echo "### \`raba\`: $SIZE bytes (limit $LIMIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::binary size $SIZE exceeds limit $LIMIT."
            echo "This is a gate, not a metric. Either justify the growth and raise"
            echo ".binary-size-limit in the same commit, or reduce the binary."
            exit 1
          fi

  vm:
    name: tier 3a — real kernel in QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-system-x86 cpio
      - name: the harness reports a failure as a failure
        # Before trusting a run that passes, prove a run that should fail does not.
        # A test rig that cannot fail reports success for reasons unrelated to the
        # code, and the first anybody hears of it is when something slips through.
        run: ./scripts/vm-test.sh --self-test
      - name: run the checks
        run: ./scripts/vm-test.sh
