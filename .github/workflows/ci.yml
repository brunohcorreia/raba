name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features so the `testing` feature's code is linted and compiled too.
      # The binary size job below is what proves it stays out of the boot binary.
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  shell:
    name: the glue cargo does not check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hooks run as root in somebody's initramfs and during somebody's
      # kernel update. `cargo test` proves what they do; this proves they are
      # not written in a way that does something else by accident.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning integration/tests/*.sh
      # The harness itself: scripts/, the packaging test and the per-distro
      # scripts under integration/tests/distro. None of it ships, and that is
      # exactly why nothing was looking at it — but a harness that fails
      # quietly reports success for a run that never happened, which is worse
      # than a harness that is merely broken. Read by hand once, in November
      # 2026; six real bugs came out of it, three of which shellcheck finds.
      - run: |
          shellcheck --severity=warning \
            scripts/*.sh \
            packaging/tests/*.sh \
            integration/tests/distro/*.sh
      # The install hook is sourced by mkinitcpio's bash, and the runtime hook
      # is run by busybox ash; neither has a shebang shellcheck can trust.
      - run: shellcheck --severity=warning --shell=bash integration/mkinitcpio/install/raba
      - run: shellcheck --severity=warning --shell=dash integration/mkinitcpio/hooks/raba
      # The pair that checks them from inside a real image, same two shells.
      - run: shellcheck --severity=warning --shell=bash integration/tests/rabacheck/install/rabacheck
      - run: shellcheck --severity=warning --shell=dash integration/tests/rabacheck/hooks/rabacheck
      - run: shellcheck --severity=warning integration/dracut/50raba/*.sh
      # The man pages are built by the PKGBUILD, so a syntax error in one is a
      # package that will not build — found exactly that way, once.
      - run: sudo apt-get install -y scdoc
      - run: |
          for page in man/*.scd; do
            scdoc < "$page" > /dev/null || exit 1
          done
      - run: |
          shellcheck --severity=warning --shell=dash \
            integration/initramfs-tools/hooks/raba \
            integration/initramfs-tools/scripts/init-premount/raba \
            integration/init/runit/raba/run \
            integration/init/runit/raba/finish \
            integration/init/s6/raba/run

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size:
    name: binary size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build and measure
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p raba
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/raba)
          LIMIT=$(cat .binary-size-limit)
          echo "raba: $SIZE bytes (limit $LIMIT)"
          echo "### \`raba\`: $SIZE bytes (limit $LIMIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::binary size $SIZE exceeds limit $LIMIT."
            echo "This is a gate, not a metric. Either justify the growth and raise"
            echo ".binary-size-limit in the same commit, or reduce the binary."
            exit 1
          fi

  vm:
    name: tier 3a — real kernel in QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-system-x86 cpio
      - name: let the runner's own kernel be read
        # Tier 3a boots the kernel the machine is already running, and GitHub's
        # images ship /boot/vmlinuz-* as 0600 root — so the script's search
        # finds a kernel it cannot open and says so. Nothing else is touched.
        run: |
          ls -l /boot || true
          sudo chmod a+r /boot/vmlinuz-* || true
      - name: the harness reports a failure as a failure
        # Before trusting a run that passes, prove a run that should fail does not.
        # A test rig that cannot fail reports success for reasons unrelated to the
        # code, and the first anybody hears of it is when something slips through.
        run: ./scripts/vm-test.sh --self-test
      - name: run the checks
        run: ./scripts/vm-test.sh
