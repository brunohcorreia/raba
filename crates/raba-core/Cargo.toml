[package]
name = "raba-core"
description = "Pure core: .raba format, layout, compositing, rendering. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Dependency budget: ZERO. This crate is pure data transformation and is linked
# into the boot binary. See docs/maintenance.md.
[dependencies]

# `testing` gates BufferSurface, a test double that must never reach the boot
# binary. The self-dependency below enables it for this crate's own test targets,
# so `cargo test` works with no extra flags while `raba` still links a core that
# does not contain it.
[features]
testing = []

[dev-dependencies]
proptest = "1"
raba-core = { path = ".", version = "0.0.0", features = ["testing"] }

[lints]
workspace = true
