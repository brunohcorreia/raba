[package]
name = "raba-gen"
description = "Build and convert .raba animations. Build-time only, never in an initramfs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "raba_gen"
path = "src/lib.rs"

[[bin]]
name = "raba-gen"
path = "src/main.rs"

# No dependency budget here. This never enters the boot path, so a crate that
# breaks is a build failure someone fixes at leisure. See docs/maintenance.md.
[dependencies]
raba-core = { path = "../raba-core", version = "0.0.0" }
raba-term = { path = "../raba-term", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# .dur import: gzipped JSON. Both are budgeted for in DEPENDENCIES.md -- raba-gen
# never enters an initramfs, so neither does the gzip code.
serde_json = "1.0"
flate2 = "1.0"

[lints]
workspace = true
